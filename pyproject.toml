[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-sim"
version = "0.1.0"
description = "Reduced-order battery thermal-runaway and dynamic-connectivity reference solver"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
battery-sim = "battery_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

